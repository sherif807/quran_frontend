workflows:
  quranalive-ios-testflight:
    name: QuranAlive iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: QuranAlive Codemagic
    environment:
      xcode: latest
      vars:
        APP_STORE_CONNECT_APP_ID: "6832800234"
        APP_STORE_CONNECT_INTERNAL_GROUP_ID: "62d6bbdb-d1e9-48f0-87d9-010976d269da"
      groups:
        - app_store_connect
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.quranalive.iphone
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Apply managed signing profiles
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/QuranAlive.xcodeproj" \
            --scheme QuranAlive
          BUILD_NUMBER=$(awk -F'"' '/CURRENT_PROJECT_VERSION:/ { print $2; exit }' ios/project.yml)
          test -n "$BUILD_NUMBER"
          echo "QURANALIVE_BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
