workflows:
  quranalive-ios-testflight:
    name: QuranAlive iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_store_connect
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.quranalive.iphone
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Apply managed signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/QuranAlive.xcodeproj" \
            --scheme QuranAlive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
